<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TPC HomeWatch</title>

<!-- PWA manifest -->
<link rel="manifest" href="manifest.json" />

<!-- Theme & status bar -->
<meta name="theme-color" content="#1B3A8C" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TPC HomeWatch" />
<link rel="apple-touch-icon" href="icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png" />

<link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css" />
<link rel="stylesheet" href="project/styles.css" />

<style>
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    /* Fill the safe area on notched phones */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(120% 120% at 50% 0%, #d3cec3 0%, #c2bdb2 60%, #b6b1a6 100%);
  }
  #root { transform-origin: center center; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="22" fill="#1B4332"/>
      <path d="M28 56 L50 36 L72 56" stroke="#52B788" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M34 53 V72 H66 V53" stroke="#F4F1EA" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </template>

  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>

  <script src="project/data.js"></script>
  <script type="text/babel" src="project/ios-frame.jsx"></script>
  <script type="text/babel" src="project/tweaks-panel.jsx"></script>
  <script type="text/babel" src="project/ui.jsx"></script>
  <script type="text/babel" src="project/screens-core.jsx"></script>
  <script type="text/babel" src="project/screens-detail.jsx"></script>
  <script type="text/babel" src="project/screens-more.jsx"></script>
  <script type="text/babel" src="project/screens-owner.jsx"></script>
  <script type="text/babel" src="project/auth.jsx"></script>
  <script type="text/babel" src="project/app.jsx"></script>

</body>
</html>
